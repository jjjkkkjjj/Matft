name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Intel: vDSP behaves differently on x86_64 for out of range conversions and NaN
        os: [ macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    # Use the Swift toolchain bundled with Xcode so that it always matches the macOS SDK
    - name: Show Swift version
      run: swift --version
    - name: Build and Test
      run: ./scripts/build-and-test-ios.sh
